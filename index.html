<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8 Ball Pool Pro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #app {
      width: 100%;
      max-width: 1200px;
      padding: 20px;
      text-align: center;
    }
    .lobby {
      background: #16213e;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      border: 1px solid #0f3460;
      transition: opacity 0.5s ease;
    }
    .lobby.hidden {
      display: none;
    }
    .lobby h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, #f7971e, #ffd200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .lobby .subtitle {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }
    .lobby .balance {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #4ecdc4;
    }
    .lobby .pot {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #f8b500;
    }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: #0f3460;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary { background: #e94560; }
    .btn-primary:hover { background: #c73e54; }
    .btn-success { background: #4ecdc4; color: #1a1a2e; }
    .btn-success:hover { background: #45b7aa; }
    .btn-warning { background: #f8b500; color: #1a1a2e; }
    .btn-warning:hover { background: #e0a300; }
    .status {
      margin-top: 20px;
      padding: 15px;
      background: #0f3460;
      border-radius: 10px;
      font-size: 1.1rem;
      color: #aaa;
    }
    .status .highlight {
      color: #4ecdc4;
      font-weight: bold;
    }
    /* Contenedor del juego */
    #game {
      width: 100%;
      height: 600px;
      background: #0a0a1a;
      border-radius: 16px;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
      border: 2px solid #0f3460;
      display: none;
    }
    #game.active {
      display: block;
    }
    @media (max-width: 768px) {
      .lobby h1 { font-size: 2rem; }
      .btn { padding: 12px 20px; font-size: 0.9rem; }
      .button-group { gap: 10px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="lobby" id="lobby">
      <h1>🎱 8 Ball Pool Pro</h1>
      <p class="subtitle">Juega con amigos o contra la máquina</p>
      <div class="balance">💰 <span id="balance">1,000</span> Fichas</div>
      <div class="pot">🏆 Bote: <span id="pot">$0</span></div>
      <div class="button-group">
        <button class="btn btn-primary" id="play-offline">🎮 Jugar Offline</button>
        <button class="btn btn-success" id="create-room">🆕 Crear Sala</button>
        <button class="btn btn-warning" id="join-room">🔗 Unirse a Sala</button>
      </div>
      <div class="status" id="status">
        Estado: <span class="highlight" id="status-text">Esperando...</span>
      </div>
    </div>
    <div id="game"></div>
  </div>
  <script type="module" src="/src/client.ts"></script>
</body>
</html>
