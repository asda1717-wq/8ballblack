<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>8 Ball Pool Pro</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- BARRA SUPERIOR (marcador) -->
    <div id="scoreboard">
      <div class="player-info left">
        <div class="player-name" id="player1-name">Jugador 1</div>
        <div class="player-balls" id="player1-balls">⚪⚪⚪⚪⚪⚪⚪</div>
      </div>
      <div class="game-info">
        <div class="turn-indicator" id="turn-indicator">▶ Tu turno</div>
        <div class="timer" id="timer">00:30</div>
      </div>
      <div class="player-info right">
        <div class="player-name" id="player2-name">Jugador 2</div>
        <div class="player-balls" id="player2-balls">⚪⚪⚪⚪⚪⚪⚪</div>
      </div>
    </div>

    <!-- CONTENEDOR DEL JUEGO (mesa) -->
    <div id="game-container">
      <div id="game">
        <svg id="polymatic-eight-ball" class="terminal"></svg>
      </div>
    </div>

    <!-- LOBBY (se oculta al iniciar partida) -->
    <div class="lobby" id="lobby">
      <h1>🎱 8 Ball Pool Pro</h1>
      <p class="subtitle">Juega con amigos o contra la máquina</p>
      <div class="balance">💰 <span id="balance">1,000</span> Fichas</div>
      <div class="pot">🏆 Bote: <span id="pot">$0</span></div>
      <div class="button-group">
        <button class="btn btn-primary" id="play-offline">🎮 Jugar Offline</button>
        <button class="btn btn-success" id="create-room">🆕 Crear Sala</button>
        <button class="btn btn-warning" id="join-room">🔗 Unirse a Sala</button>
      </div>
      <div class="status" id="status">
        <div class="status-line">
          <span class="status-label">Lobby:</span>
          <span class="status-value" id="status-text">Esperando...</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/client.ts"></script>
</body>
</html>
